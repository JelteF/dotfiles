# Large enough to hold release builds of DuckDB and its extensions for
# several worktrees at once; the 5G default makes worktrees evict each other.
max_size = 100G

# Before hashing, rewrites absolute paths under $HOME to be relative to the
# compiler's cwd (the build dir), e.g. -I/home/jelte/mono-wt1/hybrid-core/foo
# becomes -I../../foo when run from mono-wt1/hybrid-core/build/Release. So the
# same file built in different git worktrees gets the same cache key.
base_dir = /home/jelte
# Otherwise the cwd is hashed whenever -g is used, which differs per worktree.
# The cost is that debug info of cache hits points at the original worktree.
hash_dir = false

# Needed for hybrid-core's precompiled test header to be cacheable, see
# hybrid-core/test/CMakeLists.txt in mono.
sloppiness = pch_defines,time_macros
